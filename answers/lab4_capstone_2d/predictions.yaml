  units: encoded as dp*100 + tp*10 + pp
  note: >
    Corrected reference row dp8, tp1, pp1, m1, ZeRO-1. Several rows tie on
    modelled time; this is the first feasible row, not a claim that its thin
    memory margin is operationally best.

