  note: >
    States plus full-recompute activations for the derived 32-sequence,
    131072-token local micro-batch.

comm_bytes_per_step_best_config:
  value: 24500000000
  units: bytes
  note: Pure-DP gradient traffic; the reference cost model charges 30% as exposed.

